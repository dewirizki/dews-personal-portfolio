[tool.poetry]
name = "fleet-dashboard"
version = "0.1.0"
description = "Streamlit dashboard: live H3 vehicle-density heatmap and speed-anomaly alert feed, reading from the FastAPI query layer."
authors = ["Dewi Rizki Fitriani <dewirizkiftrn@gmail.com>"]
readme = "README.md"
packages = [{ include = "dashboard" }]

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "^1.39.0"
pydeck = "^0.9.1"
h3 = "^4.1.2"
pandas = "^2.2.3"
httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
